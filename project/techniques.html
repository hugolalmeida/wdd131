<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse breathing techniques for stress relief, focus, and better rest."
    />
    <meta name="author" content="Hugo Almeida" />
    <title>Breathe Well | Techniques</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="scripts/site.js"></script>
  </head>
  <body data-page="techniques">
    <header class="site-header">
      <div class="container nav-wrapper">
        <a class="brand" href="index.html" aria-label="Breathe Well home page">
          <img src="images/Logo_Breath_Well.png" alt="Breathe Well logo" />
          <span>Breathe Well</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="techniques.html" class="active">Techniques</a></li>
            <li><a href="practice.html">Practice</a></li>
            <li><a href="references.html">References</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-banner">
        <div class="container small-container">
          <p class="eyebrow">Technique library</p>
          <h1>Find a practice that fits your goal.</h1>
        </div>
      </section>

      <section class="content-section">
        <div class="container">
          <div id="technique-list" class="technique-grid" aria-live="polite"></div>
        </div>
      </section>

      <section class="content-section match-section">
        <div class="container narrow-panel">
          <div class="section-heading left-align">
            <p class="eyebrow">Personal match</p>
            <h2>Which one is best for your moment?</h2>
          </div>
          <div class="form-row">
            <label for="technique-goal">What are you trying to support?</label>
            <select id="technique-goal" name="technique-goal">
              <option value="stress">Stress relief</option>
              <option value="focus">Focus</option>
              <option value="sleep">Sleep</option>
              <option value="energy">Energy</option>
            </select>
          </div>
          <button id="technique-button" class="button primary" type="button">Recommend a technique</button>
          <div id="technique-output" class="suggestion-box" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>&copy; <span id="year">2026</span> Breathe Well</p>
        <p><a href="references.html">References</a></p>
      </div>
    </footer>
  </body>
</html>
