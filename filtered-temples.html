<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtered Temple Album</title>
    <meta
      name="description"
      content="A filterable temple album with dynamically generated temple cards."
    />
    <meta name="author" content="Hugo Almeida">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/filtered-temples.css" />
    <link rel="stylesheet" href="styles/filtered-temples-large.css" />
    <script defer src="scripts/filtered-temples.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="site-title">Temple Album</div>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
          aria-label="Toggle navigation"
        >
          ☰
        </button>
        <nav aria-label="Main navigation">
          <ul id="primary-nav" class="nav-list">
            <li><a href="#" data-filter="home">Home</a></li>
            <li><a href="#" data-filter="old">Old</a></li>
            <li><a href="#" data-filter="new">New</a></li>
            <li><a href="#" data-filter="large">Large</a></li>
            <li><a href="#" data-filter="small">Small</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page-main">
      <h1 class="page-heading">Temple Gallery</h1>
      <div class="gallery" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="copyright-year"></span> - Hugo Almeida - Brazil</p>
      <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
